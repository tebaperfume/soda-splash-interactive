<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#044e3b">
<title>Diet Soda | Pure Zero Refreshment</title>
<meta name="description" content="Experience the crisp, clean taste of Diet Soda. Zero sugar, zero compromise.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inter:wght@400;500&family=Manrope:wght@400;700&family=Galada&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
:root {
    --bg-color: #0a0a0a;
    --text-color: #ffffff;
    --accent-color: #ffffff;
    --muted-color: rgba(255, 255, 255, 0.7);
    --glass-bg: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.1);
    --font-main: 'Inter', sans-serif;
    --font-heading: 'Galada', cursive;

    --bg-inner: #0b8a78;
    --bg-mid: #044e3b;
    --bg-outer: #011411;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: radial-gradient(circle at center, var(--bg-inner) 0%, var(--bg-mid) 50%, var(--bg-outer) 100%);
    color: var(--text-color);
    font-family: var(--font-main);
    overflow: hidden;
    overflow-x: hidden;
    height: 100vh;
    height: 100dvh;
    transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
}

body.blue-theme {
    --bg-inner: #0b4f8a;
    --bg-mid: #04294e;
    --bg-outer: #010c14;
}

#bubbles-container {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; overflow: hidden;
}
.bubble-img { position: absolute; pointer-events: none; }

@keyframes floatUpImg {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.4; }
    90% { opacity: 0.4; }
    100% { transform: translateY(-110vh) translateX(30px) rotate(360deg); opacity: 0; }
}

.header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 2rem 4%; position: fixed; top: 0; width: 100%; z-index: 100;
}
.logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 1.2rem; font-family: var(--font-heading); }
.nav {
    display: flex; gap: 0.5rem; background: var(--glass-bg); padding: 0.4rem;
    border-radius: 100px; border: 1px solid var(--glass-border);
}
.nav.glass {
    position: relative; background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.nav-item {
    font-family: 'Manrope', sans-serif; color: var(--muted-color); text-decoration: none;
    font-size: 0.85rem; font-weight: 500; padding: 0.5rem 1.2rem; border-radius: 100px;
    transition: all 0.3s ease;
}
.nav-item:hover, .nav-item.active { background: #fbcfe8; color: #011d17; }
.contact-btn {
    background: rgba(0, 0, 0, 0.5); color: white; border: none; padding: 0.9rem 2rem;
    border-radius: 100px; font-weight: 600; font-size: 0.85rem; cursor: pointer;
    transition: all 0.3s ease; box-shadow: none;
}
.contact-btn:hover { background: rgba(0, 0, 0, 0.7); transform: translateY(-2px); box-shadow: none; }

.hero { height: 100dvh; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 0 4%; padding-top: 5rem; }
.hero-content {
    display: flex; justify-content: space-between; align-items: stretch;
    width: 100%; max-width: 100%; padding: 0; height: 100%; position: relative;
}

.main-title, .side-title {
    font-family: var(--font-heading); font-size: clamp(5rem, 10vw, 12rem); line-height: 0.8;
    font-weight: 400; text-transform: none; white-space: nowrap; color: white; letter-spacing: normal;
}
.outline { color: var(--text-color); }

.leaves-container {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: -1; transition: transform 0.1s ease-out;
}
.leaf {
    position: absolute; width: 60px; height: 60px; pointer-events: none; z-index: -1;
    filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.2));
}
.l1 { top: 10%; left: 15%; }
.l2 { top: 40%; left: 80%; width: 140px; height: 140px; opacity: 0.4; }
.l3 { top: 70%; left: 75%; width: 80px; height: 80px; }
.l4 { top: 85%; left: 20%; width: 120px; height: 120px; opacity: 0.3; }

.hero-left { display: flex; flex-direction: column; height: 100%; padding: 6rem 0; gap: 2rem; z-index: 100; }
@keyframes fadeInEntry { to { opacity: 1; transform: none; } }
.description { color: var(--muted-color); font-size: 1.1rem; line-height: 1.6; max-width: 400px; }
.primary-btn {
    display: flex; align-items: center; gap: 1.5rem; background: rgba(0, 0, 0, 0.5); color: white;
    border: none; padding: 0.4rem 0.4rem 0.4rem 1.5rem; border-radius: 100px; font-weight: 700;
    cursor: pointer; width: fit-content; transition: all 0.3s ease; box-shadow: none;
}
.primary-btn:hover { background: rgba(0, 0, 0, 0.7); transform: translateY(-3px); box-shadow: none; }
.plus-icon {
    background: #fbcfe8; color: #011d17; width: 38px; height: 38px; display: flex;
    align-items: center; justify-content: center; border-radius: 50%; font-size: 1.4rem;
    font-weight: 900; line-height: 1; padding-bottom: 2px; border: none;
}
.award-badge { display: flex; align-items: center; gap: 1rem; margin-top: auto; }
.award-icon {
    width: 48px; height: 48px; background: var(--glass-bg); border: 1px solid var(--glass-border);
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
}
.award-text { display: flex; flex-direction: column; }
.award-title { font-size: 0.7rem; letter-spacing: 0.1em; color: var(--muted-color); }
.award-subtitle { font-size: 0.85rem; font-weight: 600; }

.hero-center {
    display: flex; justify-content: center; align-items: center; position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; z-index: 1; opacity: 0;
    animation: fadeIn 1.5s ease-out 0.3s forwards, float 6s ease-in-out infinite;
    pointer-events: none;
    background: radial-gradient(circle at center, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
}
@keyframes fadeIn { to { opacity: 1; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
.main-product-3d {
    width: 80vw; height: 80vh; outline: none; --progress-bar-color: transparent;
    --poster-color: transparent; z-index: 1; position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(25deg); pointer-events: none;
}
.main-product-3d[camera-controls] { pointer-events: auto; }

.berries-container {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 110; transition: transform 0.1s ease-out;
}
.berries-container-bg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; transition: transform 0.1s ease-out;
}
.berry {
    position: absolute; width: 120px; height: 120px; outline: none; --progress-bar-color: transparent;
    filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
    transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.berry.no-animation { animation: none !important; }
.b1 { top: 25%; left: 30%; width: 220px; height: 220px; }
.b2 { top: 60%; left: 42%; width: 100px; height: 100px; }
.b3 { top: 30%; left: 62%; width: 250px; height: 250px; }
.b4 { top: 15%; left: 48%; width: 140px; height: 140px; }
.b5 { top: 75%; left: 20%; width: 120px; height: 120px; }
.b6 { top: 45%; left: 75%; width: 180px; height: 180px; }
.b7 { top: 15%; left: 40%; width: 80px; height: 80px; opacity: 0.7; }
.b8 { top: 50%; left: 55%; width: 70px; height: 70px; opacity: 0.6; }
.b9 { top: 80%; left: 35%; width: 75px; height: 75px; opacity: 0.7; }

.hero-right {
    display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end;
    text-align: right; height: 100%; padding: 6rem 0; z-index: 100; width: 450px; pointer-events: none;
}
@keyframes fadeInLeft { to { opacity: 1; transform: translateX(0); } }
.product-carousel { display: flex; flex-direction: column; gap: 1.5rem; align-items: flex-end; pointer-events: auto; }
.carousel-cards { display: flex; gap: 1rem; }
.card {
    background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 1rem; padding-top: 5rem;
    border-radius: 28px; display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
    cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); width: 135px;
    position: relative; backdrop-filter: blur(10px); text-align: center;
}
.card:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.4); }
.card.active { border-color: #fbcfe8; border-width: 1px; background: var(--glass-bg); box-shadow: none; }
.card img {
    width: 140px; height: auto; margin-top: -8rem; filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.5));
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) !important; display: block;
    will-change: transform; pointer-events: none;
}
.card:hover img { transform: translateY(-30px) rotate(-12deg) scale(1.15) !important; }
.card-info { display: flex; flex-direction: column; font-size: 0.7rem; width: 100%; word-wrap: break-word; }
.card-info span:first-child { font-weight: 600; }
.card-info span:last-child { color: var(--muted-color); }
.carousel-nav { display: flex; gap: 1rem; }
.nav-arrow {
    background: var(--glass-bg); border: 1px solid var(--glass-border); color: white; width: 36px;
    height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: background 0.3s;
}
.nav-arrow:hover { background: rgba(255, 255, 255, 0.1); }
.side-title { align-self: flex-end; text-align: right; }

@keyframes shine {
    from { transform: translateX(-100%) rotate(45deg); }
    to { transform: translateX(200%) rotate(45deg); }
}

/* ---------- Floating WhatsApp ---------- */
.wa-fab {
    position: fixed; right: 1.25rem; bottom: 1.25rem; z-index: 800;
    width: 56px; height: 56px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25);
    background: #25D366; color: #04301a; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 14px 34px rgba(0,0,0,0.45); text-decoration: none;
    transition: transform 0.3s ease, filter 0.3s ease;
    animation: waPulse 2.6s ease-in-out infinite;
}
.wa-fab:hover { transform: translateY(-4px) scale(1.05); filter: brightness(1.06); }
@keyframes waPulse {
    0%, 100% { box-shadow: 0 14px 34px rgba(0,0,0,0.45), 0 0 0 0 rgba(37,211,102,0.45); }
    50% { box-shadow: 0 14px 34px rgba(0,0,0,0.45), 0 0 0 16px rgba(37,211,102,0); }
}
.wa-line {
    display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.1rem; padding: 0.9rem 1rem;
    border-radius: 18px; background: rgba(37,211,102,0.12); border: 1px solid rgba(37,211,102,0.35);
    color: #fff; text-decoration: none; font-size: 0.88rem; font-weight: 600;
}
.wa-line small { display: block; font-weight: 400; color: var(--muted-color); font-size: 0.72rem; }
.wa-line:hover { background: rgba(37,211,102,0.2); }

/* ---------- Responsive ---------- */
@media (max-width: 1280px) {
    .main-product-3d { width: 92vw; height: 66vh; }
    .hero-right { width: 380px; }
    .main-title, .side-title { font-size: clamp(3.5rem, 8vw, 7rem); }
}
@media (max-width: 1024px) {
    .header { padding: 1.2rem 5%; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
    .nav { order: 3; flex: 1 1 100%; min-width: 0; width: 100%; justify-content: flex-start; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .nav-item { flex: 0 0 auto; }
    .nav::-webkit-scrollbar { display: none; }
    .logo { margin-right: auto; }
    .hero { padding: 0 5%; padding-top: 8.5rem; align-items: flex-start; }
    .hero-content { flex-direction: column; align-items: center; justify-content: space-between; }
    .hero-left { padding: 0; align-items: center; text-align: center; gap: 1rem; }
    .description { font-size: 0.95rem; max-width: 90vw; }
    .primary-btn { margin: 0 auto; }
    .award-badge { display: none; }
    .hero-right { width: 100%; align-items: center; text-align: center; padding: 0 0 1.5rem; }
    .side-title { display: none; }
    .main-title { font-size: clamp(3rem, 13vw, 5.5rem); }
    .main-product-3d { width: 100vw; height: 55vh; top: 48%; }
    .b3, .b6 { display: none; }
}
@media (max-width: 640px) {
    body { height: 100dvh; }
    .header { padding: 1rem 4%; }
    .logo { font-size: 1rem; }
    .nav { padding: 0.3rem; gap: 0.2rem; }
    .nav-item { font-size: 0.72rem; padding: 0.45rem 0.75rem; }
    .contact-btn { padding: 0.7rem 1.2rem; font-size: 0.75rem; }
    .hero { padding-top: 8rem; }
    .hero-left { gap: 0.6rem; }
    .hero-right { padding-bottom: 0.75rem; }
    .berry { opacity: 0.85; }
    .main-title { font-size: clamp(2.6rem, 15vw, 4rem); }
    .description { font-size: 0.85rem; line-height: 1.5; }
    .main-product-3d { width: 112vw; height: 44vh; top: 44%; }
    .card { width: 108px; padding: 0.75rem; padding-top: 3.6rem; border-radius: 22px; gap: 1rem; }
    .card img { width: 104px; margin-top: -6rem; }
    .card-info { font-size: 0.65rem; }
    .nav-arrow { width: 44px; height: 44px; }
    .b2, .b5, .b7, .b8, .b9 { display: none; }
    .panel { padding: 1.5rem; border-radius: 22px; max-height: 86vh; }
    .panel h3 { font-size: 1.6rem; }
    .overlay { padding: 1rem; }
    .stat-grid { grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .stat b { font-size: 1.1rem; }
    .info-row { flex-direction: column; align-items: flex-start; gap: 0.25rem; }
    .info-row span { text-align: left; }
    .wa-fab { width: 50px; height: 50px; right: 1rem; bottom: 1rem; }
    .toast { bottom: 5.2rem; width: max-content; max-width: 88vw; text-align: center; }
}
@media (max-height: 620px) and (max-width: 1024px) {
    .main-product-3d { height: 42vh; }
    .description { display: none; }
}

/* ---------- Interactive layers: modals, cart, toast ---------- */
.nav-item, .contact-btn, .primary-btn, .nav-arrow, .card { -webkit-tap-highlight-color: transparent; }

.overlay {
    position: fixed; inset: 0; z-index: 500; display: flex; align-items: center; justify-content: center;
    padding: 2rem; background: rgba(1, 12, 10, 0.55); backdrop-filter: blur(14px);
    opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
}
.overlay.open { opacity: 1; pointer-events: auto; }
.panel {
    width: min(560px, 100%); max-height: 80vh; overflow-y: auto;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.22);
    border-radius: 28px; padding: 2.2rem; backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    transform: translateY(24px) scale(0.97); opacity: 0; transition: all 0.45s cubic-bezier(0.2,0.8,0.2,1);
}
.overlay.open .panel { transform: none; opacity: 1; }
.panel h3 { font-family: var(--font-heading); font-size: 2rem; font-weight: 400; margin-bottom: 0.35rem; }
.panel .panel-sub { color: var(--muted-color); font-size: 0.85rem; margin-bottom: 1.5rem; }
.panel-close {
    position: absolute; top: 1.1rem; right: 1.1rem; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--glass-border); background: var(--glass-bg); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 1rem;
}
.panel-close:hover { background: rgba(255,255,255,0.15); }
.panel-inner { position: relative; }
.info-list { display: flex; flex-direction: column; gap: 0.9rem; }
.info-row {
    display: flex; justify-content: space-between; gap: 1rem; align-items: center;
    padding: 0.85rem 1rem; border-radius: 16px; background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border); font-size: 0.85rem;
}
.info-row strong { font-weight: 600; }
.info-row span { color: var(--muted-color); text-align: right; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-bottom: 1.25rem; }
.stat {
    text-align: center; padding: 1rem 0.5rem; border-radius: 18px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
}
.stat b { display: block; font-size: 1.4rem; font-family: var(--font-heading); font-weight: 400; color: #fbcfe8; }
.stat small { color: var(--muted-color); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; }
.review { padding: 1rem; border-radius: 18px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); }
.review p { font-size: 0.85rem; line-height: 1.5; color: rgba(255,255,255,0.9); }
.review .who { margin-top: 0.6rem; font-size: 0.72rem; color: var(--muted-color); }
.stars { color: #fbcfe8; letter-spacing: 0.15em; font-size: 0.8rem; }

.field { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
.field label { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted-color); }
.field input, .field textarea {
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border); border-radius: 14px;
    padding: 0.8rem 1rem; color: #fff; font-family: var(--font-main); font-size: 16px; outline: none;
    transition: border-color 0.3s, background 0.3s;
}
@supports (-webkit-touch-callout: none) {
    .field input, .field textarea { font-size: 16px; }
}
.field input:focus, .field textarea:focus { border-color: #fbcfe8; background: rgba(255,255,255,0.1); }
.field textarea { resize: vertical; min-height: 90px; }
.field .err { font-size: 0.7rem; color: #ffb4c8; display: none; }
.field.invalid input, .field.invalid textarea { border-color: #ffb4c8; }
.field.invalid .err { display: block; }

.panel-btn {
    width: 100%; padding: 0.95rem; border-radius: 100px; border: none; cursor: pointer;
    background: #fbcfe8; color: #011d17; font-weight: 700; font-size: 0.9rem; font-family: var(--font-main);
    transition: transform 0.25s, filter 0.25s;
}
.panel-btn:hover { transform: translateY(-2px); filter: brightness(1.08); }

.pay-secure { display: flex; align-items: center; justify-content: center; gap: 0.4rem; color: #7fe3c7; font-size: 0.72rem; margin-bottom: 1.1rem; text-align: center; }
.pay-methods { display: flex; gap: 0.6rem; margin-bottom: 1.2rem; }
.pay-method {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.45rem;
    padding: 0.7rem 0.4rem; border-radius: 14px; border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.05); color: #fff; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    transition: all 0.25s; font-family: var(--font-main); -webkit-tap-highlight-color: transparent;
}
.pay-method:hover { background: rgba(255,255,255,0.12); }
.pay-method.active { border-color: #fbcfe8; background: rgba(251,207,232,0.16); color: #fbcfe8; }
.pay-row { display: flex; gap: 0.8rem; }
.pay-row .field { flex: 1; min-width: 0; }
.pay-submit { display: flex; align-items: center; justify-content: center; gap: 0.6rem; }
.pay-spinner {
    width: 17px; height: 17px; border-radius: 50%; display: inline-block;
    border: 2px solid rgba(1,17,23,0.25); border-top-color: #011d17;
    animation: paySpin 0.7s linear infinite;
}
@keyframes paySpin { to { transform: rotate(360deg); } }
.order-done-icon {
    width: 64px; height: 64px; margin: 0.4rem auto 1rem; border-radius: 50%;
    background: rgba(37,211,102,0.15); border: 1px solid #25D366;
    display: flex; align-items: center; justify-content: center;
}
.order-done-icon svg { animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }
@keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
.order-summary { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 16px; padding: 0.9rem 1rem; margin: 1rem 0 1.2rem; }
.order-summary .info-row { background: transparent; border: none; padding: 0.55rem 0; border-bottom: 1px solid var(--glass-border); border-radius: 0; }
.order-summary .info-row:last-child { border-bottom: none; }
.pay-demo-note { font-size: 0.72rem; color: var(--muted-color); text-align: center; margin-top: 0.8rem; }
@media (max-width: 640px) {
    .pay-row { gap: 0.5rem; }
    .pay-method { font-size: 0.7rem; padding: 0.6rem 0.3rem; }
}

.cart-line { display: flex; align-items: center; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--glass-border); }
.cart-line img { width: 54px; }
.cart-line .cl-name { flex: 1; font-size: 0.9rem; font-weight: 600; }
.qty { display: flex; align-items: center; gap: 0.75rem; }
.qty button {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--glass-border);
    background: var(--glass-bg); color: #fff; cursor: pointer;
}

<script>
const modelViewer = document.querySelector('#product-model');
const berriesFG = document.querySelector('.berries-container');
const berriesBG = document.querySelector('.berries-container-bg');
const leavesBG = document.querySelector('.leaves-container');
const allBerries = document.querySelectorAll('.berry');
const cards = document.querySelectorAll('.card');
let isSwitching = false;
let switchSpin = 0;
let blueTexture = null;
let greenTexture = null;

// Preload textures & Warm up shaders
modelViewer.addEventListener('load', async () => {
    // Let the main can load first; keep heavy decorative models deferred
    document.querySelectorAll('model-viewer').forEach(mv => {
        if (mv !== modelViewer) {
            mv.setAttribute('loading', 'lazy');
        }
    });
    try {
        blueTexture = await modelViewer.createTexture('https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/blue%20base%20color.jpg');
        greenTexture = await modelViewer.createTexture('https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/green%20base%20color.jpg');

        // Shader Warm-up: Briefly apply textures to compile shaders
        if (modelViewer.model) {
            const material = modelViewer.model.materials[0];
            if (material && material.pbrMetallicRoughness.baseColorTexture) {
                // Apply blue
                material.pbrMetallicRoughness.baseColorTexture.setTexture(blueTexture);
                await new Promise(r => requestAnimationFrame(r));
                // Apply green back
                material.pbrMetallicRoughness.baseColorTexture.setTexture(greenTexture);
            }
        }
    } catch (e) { console.error("Texture preload failed", e); }
});

cards.forEach(card => {
    card.addEventListener('click', () => selectFlavor(card.dataset.flavor));
});

async function switchFlavor(flavor) {
    if (isSwitching) return;
    isSwitching = true;
    const body = document.body;
    const berries = document.querySelectorAll('.berry');
    const heroCenter = document.querySelector('.hero-center');

    // 1. Background Animation
    const targetColors = flavor === 'blue' ?
        { inner: '#0b4f8a', mid: '#04294e', outer: '#010c14' } :
        { inner: '#0b8a78', mid: '#044e3b', outer: '#011411' };

    gsap.to(body, {
        '--bg-inner': targetColors.inner,
        '--bg-mid': targetColors.mid,
        '--bg-outer': targetColors.outer,
        duration: 1.5,
        ease: 'power2.inOut'
    });

    // 2. Can Spin Animation
    const spinObj = { val: 0, blur: 0 };
    gsap.to(spinObj, {
        val: 360,
        blur: 15,
        duration: 0.6,
        ease: "power2.in",
        onUpdate: () => {
            switchSpin = spinObj.val;
            modelViewer.style.filter = `blur(${spinObj.blur}px)`;
        },
        onComplete: async () => {
            // SWAP at peak
            if (flavor === 'blue') {
                body.classList.add('blue-theme');
                if (modelViewer.model && blueTexture) {
                    modelViewer.model.materials.forEach(material => {
                        if (material.pbrMetallicRoughness.baseColorTexture) {
                            material.pbrMetallicRoughness.baseColorTexture.setTexture(blueTexture);
                        }
                    });
                }
            } else {
                body.classList.remove('blue-theme');
                if (modelViewer.model && greenTexture) {
                    modelViewer.model.materials.forEach(material => {
                        if (material.pbrMetallicRoughness.baseColorTexture) {
                            material.pbrMetallicRoughness.baseColorTexture.setTexture(greenTexture);
                        }
                    });
                }
            }

            gsap.to(spinObj, {
                val: 720,
                blur: 0,
                duration: 1.5,
                ease: "back.out(0.7)",
                onUpdate: () => {
                    switchSpin = spinObj.val;
                    modelViewer.style.filter = `blur(${spinObj.blur}px)`;
                },
                onComplete: () => {
                    switchSpin = 0;
                    modelViewer.style.filter = 'none';
                }
            });
        }
    });

    // 3. Berries "Hide & Reveal" with Dynamic Positioning
    let completedBerries = 0;
    berries.forEach((berry, i) => {
        const bW = berry.offsetWidth / 2;
        const bH = berry.offsetHeight / 2;
        const centerX = (window.innerWidth / 2 - berry.offsetLeft - bW);
        const centerY = (window.innerHeight / 2 - berry.offsetTop - bH);

        const startAngle = parseFloat(berry.dataset.angle) || 0;
        const currentBaseX = parseFloat(berry.dataset.baseX) || 0;
        const currentBaseY = parseFloat(berry.dataset.baseY) || 0;

        const nextBaseX = (Math.random() - 0.5) * 200;
        const nextBaseY = (Math.random() - 0.5) * 200;

        gsap.set(berry, {
            rotation: startAngle,
            x: currentBaseX,
            y: currentBaseY
        });

        const berryTl = gsap.timeline();

        berryTl.to(berry, {
            x: centerX,
            y: centerY,
            rotation: startAngle + 45,
            scale: 0.1,
            opacity: 0,
            duration: 0.5,
            ease: "power2.in",
            onComplete: () => {
                berry.src = flavor === 'blue' ? 'https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/blueberry.glb' : 'https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb';
                heroCenter.style.zIndex = 50;
            }
        })
        .to(berry, {
            duration: 0.3
        })
        .to(berry, {
            onStart: () => {
                heroCenter.style.zIndex = 1;
            },
            x: nextBaseX,
            y: nextBaseY,
            rotation: startAngle + 90,
            scale: 1,
            opacity: 1,
            duration: 0.9,
            ease: "back.out(1.5)",
            onComplete: () => {
                berry.dataset.angle = startAngle + 90;
                berry.dataset.baseX = nextBaseX;
                berry.dataset.baseY = nextBaseY;
                berry.dataset.rx = 0;
                berry.dataset.ry = 0;

                completedBerries++;
                if (completedBerries === berries.length) {
                    isSwitching = false;
                }
            }
        });
    });
}


// Track berry states for smoothing
allBerries.forEach(b => {
    b.dataset.rx = 0; b.dataset.ry = 0; b.dataset.angle = Math.random() * 360;
    b.dataset.baseX = 0; b.dataset.baseY = 0;
    b.dataset.targetRx = 0; b.dataset.targetRy = 0;
});

let mouse = { x: 0, y: 0, px: 0, py: 0 };
let currentMouse = { x: 0, y: 0 };

function updatePointer(x, y) {
    mouse.x = (x / window.innerWidth) - 0.5;
    mouse.y = (y / window.innerHeight) - 0.5;
    mouse.px = x;
    mouse.py = y;
}
window.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
window.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (t) updatePointer(t.clientX, t.clientY);
}, { passive: true });
window.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    if (t) updatePointer(t.clientX, t.clientY);
}, { passive: true });
// Gentle auto-motion on touch devices with no pointer
const isTouch = window.matchMedia('(hover: none)').matches;
let modelInteracting = false;
let modelInteractTimer = null;
function pauseAutoOrbit() {
    modelInteracting = true;
    clearTimeout(modelInteractTimer);
    modelInteractTimer = setTimeout(() => { modelInteracting = false; }, 4000);
}
modelViewer.addEventListener('pointerdown', pauseAutoOrbit);
modelViewer.addEventListener('touchstart', pauseAutoOrbit, { passive: true });
if (isTouch) {
    setInterval(() => {
        const t = Date.now() * 0.0004;
        mouse.x = Math.sin(t) * 0.35;
        mouse.y = Math.cos(t * 0.8) * 0.2;
        mouse.px = window.innerWidth / 2 + Math.sin(t) * window.innerWidth * 0.35;
        mouse.py = window.innerHeight / 2 + Math.cos(t * 0.8) * window.innerHeight * 0.25;
    }, 60);
}
// Swipe to change flavor
let touchStartX = null;
let touchOnModel = false;
window.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0] ? e.touches[0].clientX : null;
    touchOnModel = e.touches[0] ? modelViewer.contains(e.touches[0].target) : false;
}, { passive: true });
window.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const endX = e.changedTouches[0] ? e.changedTouches[0].clientX : touchStartX;
    const dx = endX - touchStartX;
    touchStartX = null;
    if (Math.abs(dx) < 70 || touchOnModel || document.getElementById('overlay').classList.contains('open')) return;
    const i = flavorOrder.indexOf(currentFlavor);
    selectFlavor(flavorOrder[(i + (dx < 0 ? 1 : -1) + flavorOrder.length) % flavorOrder.length]);
}, { passive: true });

function animate() {
    const time = Date.now() * 0.001;
    currentMouse.x += (mouse.x - currentMouse.x) * 0.05;
    currentMouse.y += (mouse.y - currentMouse.y) * 0.05;

    if (!modelInteracting) {
        modelViewer.cameraOrbit = `${(currentMouse.x * 40) + switchSpin}deg ${90 + (currentMouse.y * 20)}deg 380%`;
    }

    berriesFG.style.transform = `translate(${currentMouse.x * 60}px, ${currentMouse.y * 60}px)`;
    berriesBG.style.transform = `translate(${currentMouse.x * -30}px, ${currentMouse.y * -30}px)`;
    leavesBG.style.transform = `translate(${currentMouse.x * -15}px, ${currentMouse.y * -15}px)`;

    if (!isSwitching) {
        allBerries.forEach((berry, i) => {
            const berryRect = berry.getBoundingClientRect();
            const berryX = berryRect.left + berryRect.width / 2;
            const berryY = berryRect.top + berryRect.height / 2;

            const diffX = mouse.px - berryX;
            const diffY = mouse.py - berryY;
            const distance = Math.sqrt(diffX * diffX + diffY * diffY);

            let targetRx = 0, targetRy = 0, speedMult = 1;

            if (distance < 400) {
                const force = (400 - distance) / 400;
                targetRx = (diffX / distance) * force * -80;
                targetRy = (diffY / distance) * force * -80;
                speedMult = 1 + force * 5;
            }

            let rx = parseFloat(berry.dataset.rx) || 0;
            let ry = parseFloat(berry.dataset.ry) || 0;
            let angle = parseFloat(berry.dataset.angle) || 0;
            let baseX = parseFloat(berry.dataset.baseX) || 0;
            let baseY = parseFloat(berry.dataset.baseY) || 0;

            rx += (targetRx - rx) * 0.1;
            ry += (targetRy - ry) * 0.1;
            angle += 0.2 * speedMult;

            berry.dataset.rx = rx;
            berry.dataset.ry = ry;
            berry.dataset.angle = angle;

            const dur = [5, 7, 6, 8, 5.5, 6.5, 9, 11, 10][i % 9];
            const phase = (time + i * 0.7) * (Math.PI * 2 / dur);
            const floatY = Math.sin(phase) * 15;
            const floatAngle = Math.cos(phase) * 6;

            berry.style.transform = `translate(calc(${rx + baseX}px), calc(${ry + baseY}px + ${floatY}px)) rotate(calc(${angle}deg + ${floatAngle}deg))`;
        });
    }

    document.querySelectorAll('.leaf').forEach((leaf, i) => {
        const dur = 10 + i * 2;
        const phase = (time + i * 1.2) * (Math.PI * 2 / dur);
        const floatY = Math.sin(phase) * 20;
        const floatX = Math.cos(phase * 0.5) * 15;
        const floatAngle = Math.sin(phase * 0.3) * 15;
        leaf.style.transform = `translate(${floatX}px, ${floatY}px) rotate(${floatAngle}deg)`;
    });

    requestAnimationFrame(animate);
}

animate();

// Bubbles Generator using bubble.png
const bubblesContainer = document.getElementById('bubbles-container');
function createBubble() {
    if (!bubblesContainer) return;
    const bubble = document.createElement('img');
    bubble.src = 'https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/bubble.png';
    bubble.className = 'bubble-img';
    const size = Math.random() * 20 + 10 + 'px';
    bubble.style.width = size;
    bubble.style.height = 'auto';
    bubble.style.left = Math.random() * 100 + '%';
    bubble.style.bottom = '-50px';
    bubble.style.opacity = Math.random() * 0.4 + 0.2;

    const duration = Math.random() * 6 + 4;
    bubble.style.animation = `floatUpImg ${duration}s linear forwards`;

    bubblesContainer.appendChild(bubble);
    setTimeout(() => bubble.remove(), duration * 1000);
}
setInterval(createBubble, isTouch || window.innerWidth <= 640 ? 750 : 400);

/* =============== Interactivity: nav panels, cart, contact =============== */
const FLAVORS = {

const overlay = document.getElementById('overlay');
const panelBody = document.getElementById('panel-body');
const toastEl = document.getElementById('toast');
const cartBadge = document.getElementById('cart-badge');

function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

function updateBadge() {
    cartBadge.textContent = cartQty;
    cartBadge.classList.toggle('show', cartQty > 0);
}

function selectFlavor(flavor) {
    if (isSwitching || flavor === currentFlavor) return;
    currentFlavor = flavor;
    cards.forEach(c => c.classList.toggle('active', c.dataset.flavor === flavor));
    switchFlavor(flavor);
    toast(`${FLAVORS[flavor].name} selected`);
}


document.getElementById('prev-flavor').addEventListener('click', () => {
    const i = flavorOrder.indexOf(currentFlavor);
    selectFlavor(flavorOrder[(i - 1 + flavorOrder.length) % flavorOrder.length]);
});
document.getElementById('next-flavor').addEventListener('click', () => {
    const i = flavorOrder.indexOf(currentFlavor);
    selectFlavor(flavorOrder[(i + 1) % flavorOrder.length]);
});

function openPanel(key) {
    const build = PANELS[key];
    if (!build) return;
    panelBody.innerHTML = build();
    overlay.classList.add('open');
    if (key === 'contact') wireContactForm();
    if (key === 'cart') wireCart();
    if (key === 'payment') wirePayment();
    if (key === 'success') wireSuccess();
}
function closePanel() { overlay.classList.remove('open'); }

document.getElementById('panel-close').addEventListener('click', closePanel);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closePanel(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanel(); });

document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', (e) => {
        e.preventDefault();
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        item.classList.add('active');
        openPanel(item.dataset.panel);
    });
});

document.querySelector('.contact-btn').addEventListener('click', () => {
    openPanel(cartQty > 0 ? 'cart' : 'contact');
});

document.getElementById('shop-now').addEventListener('click', () => {
    if (cartQty === 0) cartQty = 1;
    updateBadge();
    openPanel('cart');
});

function wireCart() {
const f = FLAVORS[currentFlavor];
        const val = document.getElementById('qty-val');
        const total = document.getElementById('cart-total');
        const sync = () => {
            val.textContent = cartQty;
            total.textContent = '$' + (f.price * cartQty).toFixed(2);
            updateBadge();
        };
        document.getElementById('qty-plus').addEventListener('click', () => { cartQty = Math.min(cartQty + 1, 99); sync(); });
        document.getElementById('qty-minus').addEventListener('click', () => { cartQty = Math.max(cartQty - 1, 1); sync(); });
        document.getElementById('checkout-btn').addEventListener('click', () => {
            openPanel('payment');
        });
        sync();
    }

function finishPayment(btn, label) {
    const orig = btn.innerHTML;
    btn.innerHTML = '<span class="pay-spinner"></span> Processing&hellip;';
    btn.disabled = true;
    toast('Processing payment…');
    setTimeout(() => {
        const f = FLAVORS[currentFlavor];
        const qty = Math.max(cartQty, 1);
        lastOrder = { name: f.name, qty, price: f.price, total: (f.price * qty).toFixed(2), method: label };
        btn.innerHTML = orig;
        btn.disabled = false;
        openPanel('success');
        toast('Payment approved — demo only!');
    }, 2200);
}

function wirePayment() {
    const f = FLAVORS[currentFlavor];
    const amountEl = document.getElementById('pay-amount');
    if (amountEl) amountEl.textContent = '$' + (f.price * Math.max(cartQty, 1)).toFixed(2);

    let method = 'card';
    const bodies = {
        card: document.querySelector('[data-pay-body="card"]'),
        paypal: document.querySelector('[data-pay-body="paypal"]'),
        apple: document.querySelector('[data-pay-body="apple"]')
    };
    document.querySelectorAll('.pay-method').forEach(btn => {
        btn.addEventListener('click', () => {
            method = btn.dataset.pay;
            document.querySelectorAll('.pay-method').forEach(x => x.classList.toggle('active', x === btn));
            Object.entries(bodies).forEach(([k, el]) => { if (el) el.style.display = k === method ? '' : 'none'; });
        });
    });

    const num = document.getElementById('pay-number');
    const exp = document.getElementById('pay-exp');
    const cvv = document.getElementById('pay-cvv');
    num.addEventListener('input', () => {
        num.value = num.value.replace(/\D/g, '').slice(0, 16).replace(/(.{4})/g, '$1 ').trim();
        num.closest('.field').classList.remove('invalid');
    });
    exp.addEventListener('input', () => {
        let v = exp.value.replace(/\D/g, '').slice(0, 4);
        exp.value = v.length > 2 ? v.slice(0, 2) + ' / ' + v.slice(2) : v;
        exp.closest('.field').classList.remove('invalid');
    });
    cvv.addEventListener('input', () => {
        cvv.value = cvv.value.replace(/\D/g, '').slice(0, 4);
        cvv.closest('.field').classList.remove('invalid');
    });

    const form = document.getElementById('pay-form');
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('pay-name');
        const checks = [
            [num, num.value.replace(/\D/g, '').length >= 16],
            [exp, exp.value.length === 7],
            [cvv, cvv.value.length >= 3],
            [name, name.value.trim().length > 1]
        ];
        let ok = true;
        checks.forEach(([el, valid]) => {
            el.closest('.field').classList.toggle('invalid', !valid);
            if (!valid) ok = false;
        });
        if (!ok) { toast('Please complete all card fields'); return; }
        finishPayment(document.getElementById('pay-btn'), 'Card &bull;&bull;&bull;&bull; ' + num.value.replace(/\D/g, '').slice(-4));
    });
    document.getElementById('paypal-btn').addEventListener('click', () => {
        finishPayment(document.getElementById('paypal-btn'), 'PayPal (demo)');
    });
    document.getElementById('apple-btn').addEventListener('click', () => {
        finishPayment(document.getElementById('apple-btn'), 'Apple Pay (demo)');
    });
}

function wireSuccess() {
    const o = lastOrder;
    document.getElementById('finish-order').addEventListener('click', () => {
        const order = `Hi! I'd like to order ${o.qty} x ${o.name} ($${o.total}). Paid via ${o.method}.`;
        window.open(`${WA_LINK}?text=${encodeURIComponent(order)}`, '_blank', 'noopener');
        toast(`Order sent on WhatsApp — ${o.qty} × ${o.name}!`);
        cartQty = 0;
        updateBadge();
        closePanel();
    });
    document.getElementById('keep-shopping').addEventListener('click', () => {
        cartQty = 0;
        updateBadge();
        closePanel();
        toast('Thanks for visiting!');
    });
}

function wireContactForm() {
    const form = document.getElementById('contact-form');
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = form.querySelector('#cf-name');
        const email = form.querySelector('#cf-email');
        const msg = form.querySelector('#cf-msg');
        const checks = [
            [name, name.value.trim().length > 1],
            [email, /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())],
            [msg, msg.value.trim().length > 4]
        ];
        let ok = true;
        checks.forEach(([el, valid]) => {
            el.closest('.field').classList.toggle('invalid', !valid);
            if (!valid) ok = false;
        });
        if (!ok) return;
        const text = `Hi Diet Soda! I'm ${name.value.trim()} (${email.value.trim()}).\n${msg.value.trim()}`;
        window.open(`${WA_LINK}?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
        toast(`Thanks ${name.value.trim().split(' ')[0]} — opening WhatsApp...`);
        closePanel();
    });
    form.querySelectorAll('input, textarea').forEach(el =>
        el.addEventListener('input', () => el.closest('.field').classList.remove('invalid'))
    );
}

document.querySelector('.logo').style.cursor = 'pointer';
document.querySelector('.logo').addEventListener('click', () => openPanel('home'));
updateBadge();
